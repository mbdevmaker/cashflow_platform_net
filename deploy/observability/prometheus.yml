global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cashflow-api
    static_configs: [{ targets: ["cashflow-api:8080"] }]
  - job_name: cashflow-outbox-publisher
    static_configs: [{ targets: ["cashflow-outbox-publisher:8080"] }]
  - job_name: daily-consolidation-api
    static_configs: [{ targets: ["daily-consolidation-api:8080"] }]
  - job_name: daily-consolidation-consumer
    static_configs: [{ targets: ["daily-consolidation-consumer:8080"] }]
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs: [{ targets: ["rabbitmq:15692"] }]
